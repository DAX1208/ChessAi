<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessAI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="chat-shell" aria-label="AI chat interface">
    <header class="hero">
      <div class="hero-title">
        <h1>Chess Master</h1>
        <p>Your AI chess companion — openings, strategy, and game analysis.</p>
      </div>
      <div class="hero-badge">Live Bot</div>
    </header>

    <main class="chat-window" id="chatWindow" aria-live="polite" tabindex="0">
      <div class="empty-state" id="emptyState">
        <h2>Welcome to Chess Master</h2>
        <p>Ask about openings, strategies, famous games, or get help analyzing a position.</p>
        <div class="suggestions">
          <button class="suggestion-chip" type="button" data-message="What is the Italian Game?" aria-label="Use suggested question">Explain openings</button>
          <button class="suggestion-chip" type="button" data-message="Help me with this endgame" aria-label="Use suggested question">Analyze position</button>
          <button class="suggestion-chip" type="button" data-message="Tell me about the Immortal Game" aria-label="Use suggested question">Famous games</button>
        </div>
      </div>
    </main>

    <form class="input-panel" id="chatForm">
      <div class="input-area">
        <textarea id="chatInput" rows="3" placeholder="Ask about chess openings, strategies, or analyze a position…" aria-label="Type your message"></textarea>
      </div>
      <div class="actions">
        <button type="submit" id="sendButton">Send message</button>
        <div class="info-row">
          <span class="status-pill"><span class="status-dot"></span> Connected via local server</span>
        </div>
      </div>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
