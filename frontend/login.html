<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Chess Bot</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0f11'/%3E%3Cpath d='M35,78 L65,78 L60,67 L40,67 Z M42,67 C42,52 33,47 33,35 C33,20 44,14 50,14 C56,14 67,20 67,35 C67,47 58,52 58,67 Z' fill='%23c9a227'/%3E%3Ccircle cx='50' cy='33' r='5' fill='%230f0f11'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo auth-logo">♟</div>
                <div>
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Sign in to continue your chess coaching conversations and saved session history.</p>
                </div>
            </div>

            <div id="successBanner" class="auth-banner hidden"></div>
            <form id="loginForm" class="auth-form">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" class="form-control" type="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-row">
                        <input id="password" name="password" class="form-control" type="password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword">Show</button>
                    </div>
                </div>
                <div id="errorText" class="error-text"></div>
                <div class="form-actions">
                    <button type="submit" class="auth-submit-btn">Sign In</button>
                </div>
            </form>

            <div class="form-footer">
                Don't have an account? <a class="form-link" href="signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const successBanner = document.getElementById('successBanner');
        const errorText = document.getElementById('errorText');
        const passwordField = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        function showBanner(message) {
            successBanner.textContent = message;
            successBanner.classList.remove('hidden');
        }

        function togglePasswordVisibility() {
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;
            togglePassword.textContent = type === 'password' ? 'Show' : 'Hide';
        }

        togglePassword.addEventListener('click', togglePasswordVisibility);

        const urlSearch = new URLSearchParams(window.location.search);
        if (urlSearch.get('registered') === '1') {
            showBanner('Account created! Please log in.');
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorText.textContent = '';
            successBanner.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = passwordField.value;

            if (!email || !password) {
                errorText.textContent = 'Please enter both email and password.';
                return;
            }

            try {
                const response = await fetch('../backend/api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!data.success) {
                    errorText.textContent = data.message || 'Invalid email or password';
                    return;
                }

                localStorage.setItem('chess_bot_username', data.username);
                window.location.href = 'index.html';
            } catch (err) {
                errorText.textContent = 'Unable to connect. Please try again.';
            }
        });
    </script>
</body>
</html>
