<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Chess Conversation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shared-shell">
        <div class="shared-card">
            <div class="shared-header">
                <p class="shared-eyebrow">Shared Chess Conversation</p>
                <h1 id="sharedTitle">Loading conversation…</h1>
                <p class="shared-meta" id="sharedMeta">Hosted by Chess Master AI</p>
            </div>
            <div id="sharedMessages" class="shared-messages"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const sharedMessages = document.getElementById('sharedMessages');
        const sharedTitle = document.getElementById('sharedTitle');
        const sharedMeta = document.getElementById('sharedMeta');

        async function loadSharedConversation() {
            if (!token) {
                sharedTitle.textContent = 'Invalid share link';
                sharedMessages.innerHTML = '<p class="shared-empty">This shared conversation link is missing a token.</p>';
                return;
            }

            try {
                const response = await fetch('../backend/api/get_shared_chat.php?token=' + encodeURIComponent(token));
                const data = await response.json();

                if (!data.success) {
                    sharedTitle.textContent = 'Shared conversation unavailable';
                    sharedMessages.innerHTML = '<p class="shared-empty">' + (data.message || 'Unable to load shared conversation.') + '</p>';
                    return;
                }

                sharedTitle.textContent = data.title || 'Shared conversation';
                sharedMeta.textContent = 'Shared by ' + (data.username || 'a Chess Master AI user');
                sharedMessages.innerHTML = '';

                data.messages.forEach(message => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'shared-message ' + (message.role === 'bot' ? 'bot' : 'user');

                    const bubble = document.createElement('div');
                    bubble.className = 'shared-bubble';
                    bubble.textContent = message.message;

                    const meta = document.createElement('div');
                    meta.className = 'shared-meta-text';
                    meta.textContent = message.role === 'bot' ? 'Chess Master AI' : 'Shared user message';

                    wrapper.appendChild(bubble);
                    wrapper.appendChild(meta);
                    sharedMessages.appendChild(wrapper);
                });
            } catch (error) {
                sharedTitle.textContent = 'Connection issue';
                sharedMessages.innerHTML = '<p class="shared-empty">Unable to load the shared conversation right now.</p>';
            }
        }

        loadSharedConversation();
    </script>
</body>
</html>
