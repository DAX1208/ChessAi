<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Chess Bot Account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0f11'/%3E%3Cpath d='M35,78 L65,78 L60,67 L40,67 Z M42,67 C42,52 33,47 33,35 C33,20 44,14 50,14 C56,14 67,20 67,35 C67,47 58,52 58,67 Z' fill='%23c9a227'/%3E%3Ccircle cx='50' cy='33' r='5' fill='%230f0f11'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-logo auth-logo">♟</div>
                <div>
                    <h1 class="auth-title">Create your account</h1>
                    <p class="auth-subtitle">Register to save your chess coaching conversations and access your analysis history.</p>
                </div>
            </div>

            <div id="alertBanner" class="auth-banner hidden"></div>
            <form id="signupForm" class="auth-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input id="username" name="username" class="form-control" type="text" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" class="form-control" type="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-row">
                        <input id="password" name="password" class="form-control" type="password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" id="togglePassword1">Show</button>
                    </div>
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-row">
                        <input id="confirmPassword" name="confirmPassword" class="form-control" type="password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" id="togglePassword2">Show</button>
                    </div>
                </div>
                <div id="errorText" class="error-text"></div>
                <div class="form-actions">
                    <button type="submit" class="auth-submit-btn">Create Account</button>
                </div>
            </form>

            <div class="form-footer">
                Already have an account? <a class="form-link" href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const alertBanner = document.getElementById('alertBanner');
        const errorText = document.getElementById('errorText');
        const passwordField = document.getElementById('password');
        const confirmPasswordField = document.getElementById('confirmPassword');
        const togglePassword1 = document.getElementById('togglePassword1');
        const togglePassword2 = document.getElementById('togglePassword2');

        function togglePassword(field, button) {
            const type = field.type === 'password' ? 'text' : 'password';
            field.type = type;
            button.textContent = type === 'password' ? 'Show' : 'Hide';
        }

        togglePassword1.addEventListener('click', () => togglePassword(passwordField, togglePassword1));
        togglePassword2.addEventListener('click', () => togglePassword(confirmPasswordField, togglePassword2));

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorText.textContent = '';
            alertBanner.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordField.value;
            const confirmPassword = confirmPasswordField.value;

            if (!username || !email || !password || !confirmPassword) {
                errorText.textContent = 'Please complete every field.';
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                errorText.textContent = 'Please enter a valid email address.';
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters long.';
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const response = await fetch('../backend/api/signup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();

                if (!data.success) {
                    errorText.textContent = data.message || 'Unable to create account.';
                    return;
                }

                window.location.href = 'login.html?registered=1';
            } catch (err) {
                errorText.textContent = 'Unable to connect. Please try again.';
            }
        });
    </script>
</body>
</html>
